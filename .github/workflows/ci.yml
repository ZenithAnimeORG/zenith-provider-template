name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ZenithAnimeORG/zenith-provider-sdk
          ref: 31352b446253ce2aaa657f5cfe5b3f176d66b572
          path: _sdk

      - name: Build and Publish SDK to Maven Local
        run: |
          cd _sdk
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon
          cd ..

      - name: Test package catalog tooling
        run: python3 -m unittest tools.test_zpk_tool

      - name: Run Tests and Assemble .zpk
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: check assembleZpk
